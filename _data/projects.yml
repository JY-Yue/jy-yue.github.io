current:
- {name: 'Polar Questions and Bias', advisor: 'Daphna Heller', description: 'We ask questions to gain information. Meanwhile, negative polar questions come with a \"speaker bias\" such that the speaker strongly expects the answer to be yes. The communicative function of negative questions therefore becomes fuzzy and is an interesting research topic.'}
- {name: 'Wh-indeterminates in Chinese', advisor: 'Dave Kush', description: 'Wh-words in Mandarin Chinese have interrogative and non-interrogative uses. How do listeners interpret their functions in real-time language comprehension? Can wh-words trigger a semantic garden path effect?'}

past:
- {name: 'Syntax and processing of ellipsis', advisor: 'Ming Xiang and Laura Stigliano', description: 'My first introduction to linguistic research. I studied memory retrieval in the comprehension of VP ellipsis, and also the syntax of fragment questions in Chinese.'}
- {name: 'Focus alternatives and island effect', advisor: 'Ming Xiang', description: 'My BA thesis. The discourse account of island effects attributes the unacceptability of certain long distance dependencies to the conflict of its information status. I further elaborate this &#34;conflict&#34; as a difficulty in generating the proper set of focus alternatives in interpretation.'}
- {name: 'Adaptation of predictive processing', advisor: 'Wing Yee Chow', description: 'My MPhil thesis. Using eye-tracking experiments, I study the role of speaker reliability in prediction. The goal is to examine whether listeners adapt their rate of predictive processing in the face of an unpredictable speaker that produces unexpected sentences.'}
- {name: 'Speaker knowledge and scalar implicature', advisor: 'Richard Breheny', description: 'Expanding on existing secondary inference tasks, I investigate the speaker opinionatedness hypothesis (the epistemic step) in scalar diversity by probing primary inference. Does the speaker&#39;s knowledge state affect the rate of scalar implicature made by the listener?'}
